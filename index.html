<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="以温暖的3D房间为入口，探索我的教育背景、实习经历与AI产品项目。" />
  <title>我的小小世界 | 互动作品集</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #35271f;
      --accent: #ad6440;
      --paper: rgba(255, 248, 239, .95);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #241b19;
      color: var(--ink);
    }
    button { font: inherit; }
    .viewport {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      background: radial-gradient(ellipse at center, #675149, #201918);
    }
    /* 场景保持原图比例，热点坐标用百分比：缩放时不会跑位。 */
    .scene {
      position: relative;
      width: min(100vw, 133.333dvh, 1448px);
      aspect-ratio: 1448 / 1086;
      overflow: hidden;
      isolation: isolate;
      flex: none;
      box-shadow: 0 22px 85px #120c0a65;
    }
    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      user-select: none;
      pointer-events: none;
      transition: filter .75s ease;
    }
    .light-glow {
      position: absolute;
      inset: -8%;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse 26% 26% at 85.5% 14%,
        rgba(255, 245, 134, .74) 0%,
        rgba(255, 212, 47, .50) 16%,
        rgba(255, 178, 35, .24) 38%,
        rgba(255, 167, 31, .07) 61%,
        transparent 78%);
      mix-blend-mode: screen;
      filter: blur(13px);
      opacity: 1;
      transition: opacity .7s ease;
      animation: glow-breathe 4s ease-in-out infinite alternate;
    }
    .dark-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: rgba(7, 12, 24, .25);
      opacity: 0;
      transition: opacity .75s ease;
    }
    .scene.lights-off .scene-image { filter: brightness(.37) saturate(.65); }
    .scene.lights-off .light-glow { opacity: 0; animation: none; }
    .scene.lights-off .dark-layer { opacity: 1; }
    @keyframes glow-breathe { from { opacity: .76; } to { opacity: 1; } }
    .welcome, .help {
      position: absolute;
      z-index: 5;
      color: #fffaf1;
      text-shadow: 0 2px 12px rgba(30, 15, 9, .65);
      pointer-events: none;
    }
    .welcome { top: 2.5%; left: 2.7%; }
    .welcome small { display: block; font-size: clamp(10px, 1.05vw, 14px); letter-spacing: .2em; opacity: .95; }
    .welcome h1 {
      margin: 6px 0 0;
      font-size: clamp(15px, 2vw, 28px);
      font-weight: 700;
      letter-spacing: .04em;
    }
    .help {
      bottom: 2.7%; left: 2.7%;
      padding: 9px 14px;
      border: 1px solid #ffffff65;
      background: rgba(53, 32, 26, .36);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      font-size: clamp(10px, 1vw, 14px);
    }
    .hotspot {
      position: absolute;
      z-index: 4;
      border: 2px solid transparent;
      background: transparent;
      color: #3c251c;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
      transition: background .22s, border-color .22s, box-shadow .22s;
      -webkit-tap-highlight-color: transparent;
    }
    .hotspot:hover, .hotspot:focus-visible {
      outline: none;
      background: rgba(255, 240, 182, .14);
      border-color: rgba(255, 246, 218, .9);
      box-shadow: 0 0 30px rgba(255, 233, 145, .37), inset 0 0 22px rgba(255, 248, 222, .13);
    }
    .hotspot .tag {
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: clamp(10px, 1vw, 13px);
      font-weight: 700;
      letter-spacing: .01em;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .8);
      background: rgba(255, 251, 241, .87);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 17px #29170d3b;
      transition: transform .2s, background .2s;
    }
    .hotspot:hover .tag, .hotspot:focus-visible .tag {
      transform: translateX(-50%) translateY(-4px);
      background: #fff2ce;
    }
    /* 按原始 1448 × 1086 场景图定位：小象、右侧小狗、两个木框、台灯。 */
    .elephant { left: 57%; top: 47%; width: 19.9%; height: 31%; border-radius: 48%; }
    .dog      { left: 21%; top: 13%; width: 26.5%; height: 27%; border-radius: 45%; }
    .basket1  { left: 74.3%; top: 14.2%; width: 10.5%; height: 16.5%; border-radius: 15%; }
    .basket2  { left: 85.1%; top: 14%; width: 14.5%; height: 17%; border-radius: 15%; }
    .lamp     { left: 82.2%; top: 0%; width: 13%; height: 15.5%; border-radius: 48% 48% 28% 28%; z-index: 6; }
    .lamp .tag { bottom: -2px; }
    .mobile-note { display: none; }
    /* 弹窗 */
    dialog {
      width: min(760px, calc(100vw - 32px));
      max-height: min(84dvh, 850px);
      padding: 0;
      overflow: hidden;
      color: var(--ink);
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 24px;
      background: var(--paper);
      backdrop-filter: blur(28px);
      box-shadow: 0 28px 100px #150c0a99;
    }
    dialog::backdrop { background: rgba(19, 13, 17, .62); backdrop-filter: blur(7px); }
    dialog[open] { animation: pop-in .25s ease-out; }
    @keyframes pop-in { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 26px 17px;
      border-bottom: 1px solid rgba(159, 114, 85, .20);
      background: rgba(255, 250, 242, .94);
    }
    .dialog-head h2 { margin: 0; font-size: clamp(20px, 2.4vw, 27px); }
    .close {
      flex: none;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      color: #6e4d3d;
      background: #f3e5d8;
      font-size: 24px;
      line-height: 1;
    }
    .close:hover { background: #ead4bf; }
    .dialog-body { overflow-y: auto; max-height: calc(min(84dvh, 850px) - 84px); padding: 6px 26px 26px; }
    .intro { color: #785a48; line-height: 1.85; font-size: 14px; }
    .entry { padding: 19px 0 15px; border-bottom: 1px solid #b99d852e; }
    .entry:last-child { border-bottom: none; }
    .entry-header { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 7px 16px; }
    .entry h3 { margin: 0; font-size: 18px; line-height: 1.5; }
    .date { flex: none; color: #a17960; font-size: 12px; padding-top: 4px; }
    .role { margin: 5px 0 11px; color: var(--accent); font-size: 14px; font-weight: 650; }
    .entry p, .entry li { font-size: 14px; line-height: 1.95; }
    .entry ul { padding-left: 20px; margin: 9px 0 0; }
    .entry li + li { margin-top: 7px; }
    .highlight { font-weight: 750; color: #a34e29; }
    .process { margin: 13px 0; padding: 14px 16px; background: #f7e9db; border-radius: 12px; line-height: 1.9; font-size: 14px; }
    .hint-small { font-size: 12px; color: #907462; }
    @media (max-width: 680px) {
      /* 手机可水平滑动场景，避免热点被缩成难以点击的小点。 */
      .viewport { justify-content: flex-start; align-items: flex-start; }
      .scene { width: 960px; }
      .mobile-note { display: block; position: fixed; z-index: 12; right: 10px; bottom: 10px; background: #fff7e9eb; border-radius: 12px; padding: 8px 10px; font-size: 11px; }
      .welcome h1 { font-size: 20px; }
      .hotspot .tag { font-size: 12px; }
      .dialog-head { padding: 17px 18px; }
      .dialog-body { padding: 5px 18px 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

      <div class="role">产品负责人 · 用户洞察 / 交互设计 / AI Coding</div>

  <script>
    const scene = document.getElementById('scene');
    const lampSwitch = document.getElementById('lampSwitch');
    const lampLabel = document.getElementById('lampLabel');
    const modal = document.getElementById('detailDialog');
    const modalTitle = document.getElementById('dialogTitle');
    const modalBody = document.getElementById('dialogBody');
    const titles = {
      education: '🎓 教育背景',
      internships: '💼 实习经历',
      trading: '📈 美股交易 Agent 项目',
      secret: '💌 Secret Talk 产品作品'
    };

    // 热点点击：从模板中读取内容，并在原场景上方弹出。
    document.querySelectorAll('[data-panel]').forEach(button => {
      button.addEventListener('click', () => {
        const key = button.dataset.panel;
        const template = document.getElementById(key + '-tpl');
        if (!template) return;
        modalTitle.textContent = titles[key];
        modalBody.replaceChildren(template.content.cloneNode(true));
        modalBody.scrollTop = 0;
        modal.showModal();
      });
    });

    // 灯光开关：黄光消失、场景降低亮度；再次点击恢复。
    lampSwitch.addEventListener('click', () => {
      const isOff = scene.classList.toggle('lights-off');
      lampSwitch.setAttribute('aria-checked', String(!isOff));
      lampSwitch.setAttribute('aria-label', isOff ? '开灯' : '关灯');
      lampLabel.textContent = isOff ? '💡 开灯' : '💡 关灯';
    });

    document.getElementById('closeDialog').addEventListener('click', () => modal.close());
    // 点击弹窗外侧关闭；按 Esc 也可关闭（dialog 原生支持）。
    modal.addEventListener('click', event => {
      if (event.target === modal) modal.close();
    });
  </script>
